plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android") // NO VERSION HERE
    id("kotlin-kapt")                  // Required for Hilt
    id("com.google.dagger.hilt.android") // NO VERSION HERE
}

android {
    namespace 'com.example.cppcounter'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.cppcounter"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}


dependencies {

    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-compose:1.8.2"

    implementation "androidx.compose.ui:ui:1.5.4"
    implementation "androidx.compose.material3:material3:1.1.2"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.4"

    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"


    implementation(project(":native-lib"))

    implementation "androidx.compose.material3:material3:1.1.2"

    implementation("com.google.dagger:hilt-android:2.51.1")
    implementation 'androidx.lifecycle:lifecycle-runtime-compose-android:2.10.0'
    kapt("com.google.dagger:hilt-compiler:2.51.1")
    implementation("androidx.hilt:hilt-navigation-compose:1.2.0")
    implementation("com.google.android.material:material:1.11.0")

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    testImplementation "io.mockk:mockk:1.13.10"
    testImplementation "app.cash.turbine:turbine:1.0.0"
}

kapt {
    correctErrorTypes = true
}


